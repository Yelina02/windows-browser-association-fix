name: Windows tests / Windows 测试
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell tests / Windows PowerShell 测试
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/Test-Repair.ps1
      - name: PowerShell 7 tests / PowerShell 7 测试
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/Test-Repair.ps1
