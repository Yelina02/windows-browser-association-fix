name: Windows tests / Windows 测试
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Safe tests / 无系统变更测试
        shell: ${{ matrix.shell }}
        run: ./tests/Test-Repair.ps1
